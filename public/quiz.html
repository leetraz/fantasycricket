<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Quiz Mode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #060814;
            --card-bg: rgba(10, 12, 30, 0.6);
            --border: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-dim: #8b9bb4;
            --neon-blue: #00f2fe;
            --neon-purple: #9d00ff;
            --neon-pink: #ff0055;
            --neon-green: #00ff87;
            --neon-rose: #ff2a6d;
            --amber: #ff9900;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: var(--background);
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Cyberpunk Grid Background */
        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(18, 16, 35, 0.8) 1px, transparent 1px),
                linear-gradient(90deg, rgba(18, 16, 35, 0.8) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center center;
            z-index: -2;
            opacity: 0.4;
        }

        .neon-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 100% !important;
            margin: 0 auto;
            padding: 0.4rem !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            margin-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        h1 {
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.85rem;
            line-height: 1.4;
        }

        /* Cohort Tab Buttons Style */
        .cohort-toolbar {
            display: flex;
            gap: 0.4rem;
            width: 100%;
            margin-bottom: 0.75rem;
        }
        
        .cohort-tab-btn {
            flex: 1;
            background: rgba(17, 24, 39, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-dim);
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(0.7rem, 2vw, 0.85rem);
            font-weight: 700;
            padding: 0.55rem 0.4rem;
            border-radius: 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            text-transform: uppercase;
        }
        
        .cohort-tab-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .cohort-tab-btn.active {
            color: #fff;
            background: rgba(0, 242, 255, 0.08);
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
        }

        /* Loading Indicator */
        #loading-indicator {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            margin-bottom: 0.75rem;
        }

        .progress-bar-container {
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-blue), var(--amber));
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        /* Players List */
        .players-list {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            flex-grow: 1;
        }

        .player-row-quiz {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.6rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            user-select: none;
            gap: 1rem;
        }

        .player-row-quiz:hover {
            border-color: var(--neon-blue);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.12);
            transform: translateY(-1px);
        }

        .player-row-quiz.fade-out {
            opacity: 0;
            transform: scale(0.95) translateY(-8px);
            margin-bottom: -50px;
            pointer-events: none;
        }

        .player-info-container {
            display: flex;
            align-items: center;
            min-width: 0;
            flex-shrink: 0;
        }

        .player-name-text {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .player-data-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 0;
            flex-grow: 1;
            justify-content: flex-end;
        }

        .capsules-wrapper {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            flex-wrap: nowrap;
            overflow-x: auto;
            min-width: 0;
        }

        /* Scale capsules dynamically */
        .perf-capsule {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 0.35rem;
            min-width: clamp(28px, 6vw, 44px);
            height: 24px;
            border-radius: 5px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .dismiss-btn {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            background: rgba(255, 0, 85, 0.05);
            border: 1px solid rgba(255, 0, 85, 0.25);
            color: var(--neon-pink);
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .dismiss-btn:hover {
            background: rgba(255, 0, 85, 0.2);
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
            transform: scale(1.05);
        }

        /* Refresh Button */
        .quiz-refresh-btn {
            background: linear-gradient(135deg, var(--neon-green), #00ff87) !important;
            border: none !important;
            color: #000000 !important;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            padding: 0.75rem 2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 0 15px rgba(0, 255, 135, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .quiz-refresh-btn:hover {
            box-shadow: 0 0 25px rgba(0, 255, 135, 0.75);
            transform: translateY(-2px) scale(1.02);
        }

        .quiz-refresh-btn:active {
            transform: translateY(0) scale(0.98);
        }

        @media (max-width: 768px) {
            .player-row-quiz {
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 0.45rem !important;
                padding: 0.45rem 0.6rem !important;
            }
            .player-info-container {
                width: 100% !important;
            }
            .player-data-row {
                width: 100% !important;
                justify-content: space-between !important;
                gap: 0.5rem !important;
            }
            .capsules-wrapper {
                flex-grow: 1 !important;
                width: 0 !important;
                justify-content: flex-start !important;
                overflow-x: auto !important;
                white-space: nowrap;
                padding-bottom: 4px;
            }
            .perf-capsule {
                min-width: clamp(25px, 8vw, 34px) !important;
                height: 20px !important;
                font-size: 0.7rem !important;
                padding: 0 0.15rem !important;
                border-radius: 4px !important;
            }
            .dismiss-btn {
                width: 28px !important;
                height: 28px !important;
                font-size: 0.8rem !important;
            }
        }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>
    <div class="neon-glow" style="background: var(--neon-blue); top: -20%; left: -20%;"></div>
    <div class="neon-glow" style="background: var(--neon-purple); bottom: -20%; right: -20%;"></div>

    <div class="container">

        <header>
            <h1 id="squad-title">SQUAD QUIZ MODE</h1>
            <div class="subtitle" id="squad-subtitle">Eliminate players using the dismiss button at the end of the data. Switch tabs to see stats.</div>
        </header>

        <!-- Cohort Toolbar tabs -->
        <div class="cohort-toolbar">
            <button class="cohort-tab-btn active" id="tab-recent" onclick="switchTab('recent')">☑️ RECENT</button>
            <button class="cohort-tab-btn" id="tab-h2h" onclick="switchTab('h2h')">⚔️ H2H</button>
            <button class="cohort-tab-btn" id="tab-venue" onclick="switchTab('venue')">🏟️ VENUE</button>
        </div>

        <!-- Loading indicator -->
        <div id="loading-indicator">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.4rem; font-size: 0.8rem;">
                <span id="progress-status" style="color: var(--neon-blue);">Connecting telemetry channels...</span>
                <span id="progress-percent" style="color: var(--amber);">0%</span>
            </div>
            <div class="progress-bar-container">
                <div id="progress-fill"></div>
            </div>
        </div>

        <!-- Render List Container -->
        <div class="players-list" id="players-list-container">
            <!-- Injected dynamically -->
        </div>

        <!-- Reset Button -->
        <div style="display: flex; justify-content: center; margin-top: 2rem; margin-bottom: 1rem;">
            <button id="refresh-btn" class="quiz-refresh-btn">
                🔄 Reset Quiz Roster
            </button>
        </div>

    </div>

    <script>
        // Resolve canonical team names for consistency
        // Robust, high-fidelity Loose Canonical Team Matching Logic
        const isMatchOpponent = (oppName, targetName) => {
            if (!oppName || !targetName) return false;
            
            const getCanonical = (name) => {
                name = name.toUpperCase().trim();
                if (name.includes("CHENNAI") || name.includes("CSK") || name.includes("SUPER KINGS")) return "CSK";
                if (name.includes("MUMBAI") || name.includes("MI") || name.includes("INDIANS")) return "MI";
                if (name.includes("ROYAL CHALLENGERS") || name.includes("RCB") || name.includes("BENGALURU")) return "RCB";
                if (name.includes("SUNRISERS") || name.includes("SRH") || name.includes("HYDERABAD")) return "SRH";
                if (name.includes("GUJARAT") || name.includes("GT") || name.includes("TITANS")) return "GT";
                if (name.includes("LUCKNOW") || name.includes("LSG") || name.includes("SUPER GIANTS")) return "LSG";
                if (name.includes("KOLKATA") || name.includes("KKR") || name.includes("KNIGHT RIDERS")) return "KKR";
                if (name.includes("RAJASTHAN") || name.includes("RR") || name.includes("ROYALS")) return "RR";
                if (name.includes("DELHI") || name.includes("DC") || name.includes("CAPITALS")) return "DC";
                if (name.includes("PUNJAB") || name.includes("PBKS") || name.includes("KINGS") || name.includes("KXIP")) return "PBKS";
                return name;
            };

            const oppCanonical = getCanonical(oppName);
            const targetCanonical = getCanonical(targetName);

            if (oppCanonical === targetCanonical) return true;

            const clean = (name) => {
                return name.toUpperCase()
                           .replace(/^V\s+/, '')
                           .replace(/^V\b/, '')
                           .replace(/^VS\b/, '')
                           .replace(/\bMEN\b/g, '')
                           .replace(/\bWOMEN\b/g, '')
                           .replace(/\bTEAM\b/g, '')
                           .replace(/\bW\b/g, '')
                           .replace(/\bM\b/g, '')
                           .replace(/[^A-Z0-9 ]/g, '')
                           .trim();
            };

            const oppClean = clean(oppName);
            const targetClean = clean(targetName);

            if (oppClean === targetClean) return true;
            if (oppClean.includes(targetClean) || targetClean.includes(oppClean)) return true;

            if (oppClean.length >= 3 && targetClean.startsWith(oppClean)) return true;
            if (targetClean.length >= 3 && oppClean.startsWith(targetClean)) return true;

            const oppWords = oppClean.split(/\s+/).filter(w => w.length > 3);
            const targetWords = targetClean.split(/\s+/).filter(w => w.length > 3);

            for (const w1 of oppWords) {
                if (targetWords.includes(w1)) return true;
            }

            return false;
        };

        // Parse search query
        const urlParams = new URLSearchParams(window.location.search);
        const matchUrl = urlParams.get('url');
        const teamIdx = parseInt(urlParams.get('teamIdx')) || 0;
        const teamName = urlParams.get('teamName') || 'SQUAD';
        const opponentName = urlParams.get('opponent') || 'OPPONENT';
        const groundName = urlParams.get('ground') || 'Eden Gardens';

        document.getElementById('squad-title').textContent = `${teamName} • QUIZ ROSTER`;

        let activeTab = 'recent'; // 'recent', 'h2h', 'venue'
        let playerRecords = []; // Stores { player, recentMatches, h2hMatches, venueMatches, isEstimated, element }

        async function init() {
            if (!matchUrl) {
                document.getElementById('progress-status').textContent = "ERROR: NO MATCH URL SUPPLIED";
                document.getElementById('progress-status').style.color = "var(--neon-rose)";
                return;
            }

            try {
                const res = await fetch(`/api/match-data?url=${encodeURIComponent(matchUrl)}`);
                const matchData = await res.json();
                if (matchData.error) throw new Error(matchData.error);

                const activeTeamName = matchData.teams[teamIdx];
                const squadPlayers = matchData.allPlayers.filter(p => p.team === activeTeamName);

                if (squadPlayers.length === 0) {
                    throw new Error("No players found in this squad.");
                }

                const container = document.getElementById('players-list-container');
                const progressFill = document.getElementById('progress-fill');
                const progressPercent = document.getElementById('progress-percent');
                const progressStatus = document.getElementById('progress-status');

                // Pre-create DOM placeholders to preserve squad order
                const placeholders = squadPlayers.map(p => {
                    const div = document.createElement('div');
                    container.appendChild(div);
                    return { player: p, element: div };
                });

                const CONCURRENCY_LIMIT = 4;
                let loadedCount = 0;

                async function loadPlayer(item) {
                    const p = item.player;
                    progressStatus.textContent = `Analyzing ${p.name}...`;
                    try {
                        const profileRes = await fetch(`/api/player-profile?pid=${p.player_id}&name=${encodeURIComponent(p.name)}&opponent=${encodeURIComponent(opponentName)}`);
                        const profileData = await profileRes.json();
                        
                        const matchesList = profileData.last10 || [];

                        // 1. Recent Matches
                        const recentMatches = matchesList;

                        // 2. H2H Matches against target opponent
                        const h2hMatches = matchesList.filter(m => {
                            return isMatchOpponent(m.opp, opponentName);
                        });

                        // 3. Venue Matches
                        const keywords = groundName.toLowerCase().split(/[ ,]+/);
                        let venueMatches = matchesList.filter(m => {
                            const groundLower = (m.ground || "").toLowerCase();
                            return keywords.some(keyword => keyword.length > 3 && groundLower.includes(keyword));
                        });
                        const isEstimated = venueMatches.length === 0;

                        if (isEstimated && matchesList.length > 0) {
                            venueMatches = matchesList.slice(0, Math.min(5, matchesList.length)).map(m => ({
                                ...m,
                                isSynthesized: true
                            }));
                        }

                        const record = {
                            player: p,
                            recentMatches,
                            h2hMatches,
                            venueMatches,
                            isEstimated,
                            element: item.element
                        };

                        playerRecords.push(record);
                        renderPlayerCard(record);

                    } catch (err) {
                        console.error(`Failed to load profile for ${p.name}:`, err);
                        const record = {
                            player: p,
                            recentMatches: [],
                            h2hMatches: [],
                            venueMatches: [],
                            isEstimated: true,
                            element: item.element
                        };
                        playerRecords.push(record);
                        renderPlayerCard(record);
                    }

                    loadedCount++;
                    const percent = Math.round((loadedCount / squadPlayers.length) * 100);
                    progressFill.style.width = `${percent}%`;
                    progressPercent.textContent = `${percent}%`;
                }

                // Concurrent Queue Pool Loader (size 4)
                const queue = [...placeholders];
                const activePromises = [];

                while (queue.length > 0 || activePromises.length > 0) {
                    while (activePromises.length < CONCURRENCY_LIMIT && queue.length > 0) {
                        const item = queue.shift();
                        const promise = loadPlayer(item).then(() => {
                            activePromises.splice(activePromises.indexOf(promise), 1);
                        });
                        activePromises.push(promise);
                    }
                    if (activePromises.length > 0) {
                        await Promise.race(activePromises);
                    }
                }

                progressStatus.textContent = "Telemetry sync established.";
                progressStatus.style.color = "var(--neon-green)";
                setTimeout(() => {
                    document.getElementById('loading-indicator').style.display = 'none';
                }, 800);

            } catch (err) {
                document.getElementById('progress-status').textContent = `ERROR: ${err.message}`;
                document.getElementById('progress-status').style.color = "var(--neon-rose)";
            }
        }

        function renderPlayerCard(record) {
            const p = record.player;
            const row = record.element;
            row.className = 'player-row-quiz';
            row.setAttribute('data-player-id', p.player_id);
            
            row.innerHTML = `
                <div class="player-info-container">
                    <span class="player-name-text">${p.name}</span>
                </div>
                <div class="player-data-row">
                    <div class="capsules-wrapper"></div>
                    <button class="dismiss-btn" title="Eliminate Player">✕</button>
                </div>
            `;
            
            // Clicking player name/container also triggers eliminate
            row.querySelector('.player-info-container').addEventListener('click', () => {
                dismissRow(row);
            });
            
            // Clicking dismiss button triggers eliminate
            row.querySelector('.dismiss-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                dismissRow(row);
            });
            
            const capsulesWrapper = row.querySelector('.capsules-wrapper');
            capsulesWrapper.addEventListener('click', (e) => {
                e.stopPropagation();
            });
            
            updateCapsules(record, activeTab);
        }

        function dismissRow(row) {
            row.classList.add('fade-out');
            setTimeout(() => {
                row.style.display = 'none';
            }, 300);
        }

        function updateCapsules(record, tab) {
            const capsulesWrapper = record.element.querySelector('.capsules-wrapper');
            if (!capsulesWrapper) return;

            let matches = [];
            if (tab === 'recent') {
                matches = record.recentMatches;
            } else if (tab === 'h2h') {
                matches = record.h2hMatches;
            } else if (tab === 'venue') {
                matches = record.venueMatches;
            }

            capsulesWrapper.innerHTML = generateCapsulesHTML(matches);
        }

        function generateCapsulesHTML(matchesList) {
            if (!matchesList || matchesList.length === 0) {
                return `<span style="color: rgba(255, 255, 255, 0.15); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;">NO RECORD</span>`;
            }

            const chronological = [...matchesList].reverse().slice(-10);

            const perfList = chronological.map((m, idx) => {
                let text = '';
                let isBatHigh = false;
                let colorObj = { bg: 'rgba(255,255,255,0.03)', border: 'var(--glass-border)', text: 'rgba(255,255,255,0.85)', shadow: 'none' };
                
                const hasBat = m.bat && m.bat !== '-' && m.bat !== 'DNB' && m.bat !== 'TDNB' && m.bat !== 'absent';
                const hasBowl = m.bowl && m.bowl !== '-' && m.bowl !== 'DNB';
                
                if (hasBat) {
                    const runs = parseInt(m.bat.toString().replace('*', '')) || 0;
                    
                    if (runs >= 50) {
                        colorObj = { bg: 'rgba(57, 255, 20, 0.08)', border: 'var(--neon-green)', text: 'var(--neon-green)', shadow: '0 0 8px rgba(57, 255, 20, 0.35)' };
                    } else if (runs >= 30) {
                        colorObj = { bg: 'rgba(166, 255, 0, 0.06)', border: '#a6ff00', text: '#a6ff00', shadow: 'none' };
                    } else if (runs >= 20) {
                        colorObj = { bg: 'rgba(255, 234, 0, 0.05)', border: '#ffea00', text: '#ffea00', shadow: 'none' };
                    } else if (runs >= 10) {
                        colorObj = { bg: 'rgba(255, 153, 0, 0.04)', border: '#ff9900', text: '#ff9900', shadow: 'none' };
                    } else {
                        colorObj = { bg: 'rgba(255, 0, 85, 0.04)', border: '#ff0055', text: '#ff0055', shadow: 'none' };
                    }
                    
                    text = m.bat.toString();
                    isBatHigh = true;
                }
                
                if (hasBowl) {
                    const wkts = parseInt(m.bowl) || 0;
                    const bowlText = `${m.bowl}W`;
                    text = text ? `${text} ${bowlText}` : bowlText;
                    
                    if (!isBatHigh || wkts > 0) {
                        if (wkts >= 3) {
                            colorObj = { bg: 'rgba(57, 255, 20, 0.08)', border: 'var(--neon-green)', text: 'var(--neon-green)', shadow: '0 0 8px rgba(57, 255, 20, 0.35)' };
                        } else if (wkts >= 2) {
                            colorObj = { bg: 'rgba(166, 255, 0, 0.06)', border: '#a6ff00', text: '#a6ff00', shadow: 'none' };
                        } else if (wkts >= 1) {
                            colorObj = { bg: 'rgba(255, 234, 0, 0.05)', border: '#ffea00', text: '#ffea00', shadow: 'none' };
                        } else {
                            if (!isBatHigh) {
                                colorObj = { bg: 'rgba(255, 0, 85, 0.04)', border: '#ff0055', text: '#ff0055', shadow: 'none' };
                            }
                        }
                    }
                }
                
                if (!hasBat && !hasBowl) {
                    text = 'DNB';
                    colorObj = { bg: 'rgba(255,255,255,0.01)', border: 'rgba(255,255,255,0.02)', text: 'rgba(255,255,255,0.15)', shadow: 'none' };
                }

                const synthBadge = m.isSynthesized ? `<span style="font-size: 0.55rem; color: var(--neon-purple); position: absolute; top: -3px; right: -3px;" title="Simulated venue average based on career stats">⚡</span>` : '';
                const styleString = `background: ${colorObj.bg}; border: 1px solid ${colorObj.border}; color: ${colorObj.text}; box-shadow: ${colorObj.shadow}; position: relative;`;

                return `<span class="perf-capsule" style="${styleString}">${text}${synthBadge}</span>`;
            });

            return perfList.join(' ');
        }

        function switchTab(tab) {
            if (activeTab === tab) return;

            document.getElementById(`tab-${activeTab}`).classList.remove('active');
            document.getElementById(`tab-${tab}`).classList.add('active');

            activeTab = tab;

            playerRecords.forEach(record => {
                updateCapsules(record, tab);
            });
        }

        // Reset Handler
        document.getElementById('refresh-btn').addEventListener('click', () => {
            const rows = document.querySelectorAll('.player-row-quiz');
            rows.forEach(row => {
                row.style.display = 'flex';
                // Trigger reflow
                row.offsetHeight;
                row.classList.remove('fade-out');
            });
        });

        // Run on startup
        init();
    </script>
</body>
</html>
